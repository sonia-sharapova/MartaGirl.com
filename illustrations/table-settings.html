<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Settings</title>
    <link rel="icon" href="../images/titleMiniLogo.png" />
    <link rel="stylesheet" href="../styles/pageStyle.css">
    <link rel="stylesheet" href="../styles/stylesheet.css">
    <link rel="stylesheet" href="../styles/flip-styles.css">
    <script src="../scripts/markdown-loader.js"></script>
    <script src="../scripts/flip-loader.js"></script>
    <script src="../scripts/table-layout.js"></script>
    <script src="../scripts/nav-generator.js"></script>
</head>
<style>
    .layout-toggle {
        top: 160px;
        left: 42%;
    }

    /* Override portfolio grid to have equal heights per row */
    .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        grid-auto-rows: auto;
        margin-top: 40px;
    }

    @media (max-width: 1600px) {
        .layout-toggle {
            left: 39%;
        }
    }

    @media (max-width: 1400px) {
        .layout-toggle {
            left: 35%;
        }
    }

        @media (max-width: 768px) {

        .layout-toggle {
            top: 80px;
            left: 8%;
        }
    }

</style>
<body>
<!-- Logo - Desktop shows title logo, mobile shows mini logo -->
<div class="logo">
    <picture>
        <source media="(max-width: 768px)" srcset="../images/titleMiniLogo.png">
        <img src="../images/titleLogo.png" alt="Logo" class="mini-logo">
    </picture>
</div>

<!-- Back Button -->
<div class="back-button">
    <a href="../index.html">BACK</a>
    <a id="category" href="illustration.html">ILLUSTRATION</a>
</div>

<!-- Mobile Navigation Toggle -->
<button class="mobile-nav-toggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Mobile Navigation Menu with Dropdown - Will be generated by nav-generator.js -->
<div class="mobile-nav-menu">
    <button class="mobile-nav-close" aria-label="Close navigation">×</button>
    <ul>
        <!-- Navigation items will be generated here -->
    </ul>
</div>

<!-- Desktop Main Navigation - Will be generated by nav-generator.js -->
<nav>
    <ul>
        <!-- Navigation items will be generated here -->
    </ul>
</nav>

<!-- Desktop Secondary Navigation - Will be generated by nav-generator.js -->
<div class="secondary-nav active">
    <ul>
        <!-- Secondary navigation items will be generated here -->
    </ul>
</div>


<!-- Add this after the secondary navigation in generation-conscious.html -->
<div class="layout-toggle">
    <button id="gridView" class="active">Grid View</button>
    <button id="flipView">Flipbook View</button>
</div>


<!-- Update your content containers -->
<div class="content with-secondary">
    <div id="gridContent">
        <div class="project-detail" data-markdown="table-settings.md">
            <p style="color: #999;">Loading grid content...</p>
        </div>
    </div>
    <div id="flipContent" style="display: none;">
        <div class="project-detail" data-flip-markdown="tableflip.md">
            <p style="color: #999;">Loading flipbook content...</p>
        </div>
    </div>
</div>


<!-- Decorative Shapes -->
<img src="../images/background/bck_general.jpg" alt="Hero" class="hero-image">

<!-- External JavaScript -->
<script src="../script.js"></script>
</body>
</html>
