<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marta Sharapova</title>
    <link rel="icon" href="images/titleMiniLogo.png" />
    <link rel="stylesheet" href="styles/stylesheet.css">
    <script src="scripts/nav-generator.js"></script>
</head>
<style>
    nav {
        display: flex !important;
        left: 20%;
        top: 350px;
    }

    @media (max-width: 1000px) {
        .hero-image img {
            background-position: left 20px;
        }
    }

    @media (max-width: 768px) {
        nav:not(.index-nav) {
            display: flex !important;
            left: 100px;
            top: 350px;
        }

        /* Hide desktop nav, show mobile toggle */
        .mobile-nav-toggle {
            display: flex;
        }

        .logo {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: auto;
            z-index: 1002;
        }

        .logo img {
            width: 20%;
            height: auto;
        }

        .hero-image {
            object-position: 70% center;
        }

        .content {
            margin: 0;
            padding: 20px;
        }
    }

    @media (max-width: 480px) {
        .logo {
            width: 50%;
            top: 15px;
            right: 15px;
        }

        .mobile-nav-toggle {
            top: 15px;
            left: 15px;
        }

        .mobile-nav-menu ul li a {
            font-size: 20px;
        }
    }
</style>
<body>
<!-- Logo - Desktop shows full logo, mobile shows mini logo -->
<div class="logo">
    <picture>
        <source media="(max-width: 768px)" srcset="images/titleMiniLogo.png">
        <img src="images/titleLogo.png" alt="Logo" class="logo">
    </picture>
</div>

<!-- Desktop Main Navigation - Always Vertical -->
<nav>
    <ul>
        <li><a href="design/design.html">design</a></li>
        <li><a href="films/film.html">film</a></li>
        <li><a href="branding/branding.html">branding</a></li>
        <li><a href="illustrations/illustration.html">illustration</a></li>
        <li><a href="about.html">about</a></li>
        <li><a href="contact.html">contact</a></li>
    </ul>
</nav>

<!-- Hero Image -->
<img src="images/background/bck_home.jpg" alt="Hero" class="hero-image">

<!-- External JavaScript -->
<script src="script.js"></script>
<script>
    // Mobile navigation toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
        const mobileToggle = document.querySelector('.mobile-nav-toggle');
        const mobileMenu = document.querySelector('.mobile-nav-menu');
        const mobileClose = document.querySelector('.mobile-nav-close');

        if (mobileToggle) {
            mobileToggle.addEventListener('click', function() {
                mobileMenu.classList.toggle('active');
                mobileToggle.classList.toggle('active');
            });
        }

        if (mobileClose) {
            mobileClose.addEventListener('click', function() {
                mobileMenu.classList.remove('active');
                mobileToggle.classList.remove('active');
            });
        }

        // Close menu when clicking on a link
        const mobileLinks = document.querySelectorAll('.mobile-nav-menu a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', function() {
                mobileMenu.classList.remove('active');
                mobileToggle.classList.remove('active');
            });
        });

        // Handle mobile dropdown toggles
        document.addEventListener('click', function(e) {
            if (e.target.closest('.mobile-nav-menu .has-submenu > a')) {
                e.preventDefault();
                const parent = e.target.closest('.has-submenu');
                const submenu = parent.querySelector('.submenu');

                parent.classList.toggle('open');
                submenu.classList.toggle('open');
            }
        });

        // Ensure all navigation links preserve .html extension
        const allNavLinks = document.querySelectorAll('nav a, .mobile-nav-menu a');
        allNavLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                // Check if the href contains .html
                if (href && href.includes('.html')) {
                    // Force navigation with .html extension
                    e.preventDefault();
                    window.location.href = href;
                }
            });
        });
    });
</script>
</body>
</html>
