<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWANN - Printed</title>
  <link rel="icon" href="../../images/titleMiniLogo.png" />
  <link rel="stylesheet" href="../../styles/pageStyle.css">
  <link rel="stylesheet" href="../../styles/stylesheet.css">
  <script src="../../scripts/markdown-loader.js"></script>
  <script src="../../scripts/nav-generator.js"></script>

<style>
  /* Override portfolio grid to have equal heights per row */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    grid-auto-rows: auto;
    margin-top: 40px;
  }


  .portfolio-item img {
    width: 100%;
    object-fit: cover;
    flex: 1;
  }

  /* Responsive adjustments */
  @media (max-width: 1200px) {
    .portfolio-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 768px) {
    .portfolio-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
<body>
<!-- Logo - Desktop shows title logo, mobile shows mini logo -->
<div class="logo">
  <picture>
    <source media="(max-width: 768px)" srcset="../../images/titleMiniLogo.png">
    <img src="../../images/titleLogo.png" alt="Logo" class="mini-logo">
  </picture>
</div>

<!-- Back Button -->
<div class="back-button">
  <a href="../branding.html">BACK</a>
  <a id="category" href="swann-galleries.html">SWANN GALLERIES</a>
</div>

<!-- Mobile Navigation Toggle -->
<button class="mobile-nav-toggle" aria-label="Toggle navigation">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Mobile Navigation Menu with Dropdown - Will be generated by nav-generator.js -->
<div class="mobile-nav-menu">
  <button class="mobile-nav-close" aria-label="Close navigation">×</button>
  <ul>
    <!-- Navigation items will be generated here -->
  </ul>
</div>

<!-- Desktop Main Navigation - Will be generated by nav-generator.js -->
<nav>
  <ul>
    <!-- Navigation items will be generated here -->
  </ul>
</nav>

<!-- Desktop Secondary Navigation - Will be generated by nav-generator.js -->
<div class="secondary-nav active">
  <ul>
    <!-- Secondary navigation items will be generated here -->
  </ul>
</div>

<!-- Desktop Tertiary Navigation - Will be generated by nav-generator.js -->
<div class="tertiary-nav active">
  <ul>
    <!-- Tertiary navigation items will be generated here -->
  </ul>
</div>

<!-- Main Content - This will be populated from the markdown file -->
<div class="content with-tertiary" data-markdown="printed.md">
  <div class="project-detail">
    <!-- Content will be loaded here from braille-code.md -->
    <p style="color: #999;">Loading content...</p>
  </div>
</div>


<!-- Decorative Shapes -->
<img src="../../images/background/bck_general.jpg" alt="Hero" class="hero-image">

<!-- External JavaScript -->
<script src="../../script.js"></script>
