<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Marta & Matt</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="container">
        <img src="us.png" alt="Marta and Matt" class="logo">

        <h1 class="page-title">rsvp</h1>
        <div class="back">
            <ul>
                <li><a href="index.html">← home</a></li>
            </ul>
        </div>
        <div class="content">
            <div class="section">

            <p style="text-align: left; font-size: 18px; margin-bottom: 40px;"><strong>RSVP Deadline:</strong> Early July 2026</p>

                <div class="success-message" id="successMessage">
                    Thank you for your RSVP! We look forward to celebrating with you.
                </div>

                <form class="rsvp-form" id="rsvpForm">
                    <div class="form-group">
                        <label for="fullName">Full name *</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="attending">Attending *</label>
                        <select id="attending" name="attending" required>
                            <option value="">Please select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="afterparty">Attending afterparty (10 PM–2 AM) *</label>
                        <select id="afterparty" name="afterparty" required>
                            <option value="">Please select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                            <option value="maybe">Maybe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dietary">Dietary restrictions/allergies (if not applicable, please write n/a or "none") *</label>
                        <textarea id="dietary" name="dietary" required></textarea>
                    </div>

                    <div class="form-group" style="text-align: center;">
                        <button type="submit" class="submit-btn">Submit RSVP</button>
                    </div>
                </form>

            <p class="contact-note">Please reach out to us directly at
                <span><a href="tel:+1-408-813-0951" class="phone-link">
                    (408) 813-0951</a></span> if you have any questions, concerns or requests.</p>
        </div>
        </div>

    </div>

    <script>
        // Configuration - UPDATE THESE URLs
        const SERVER_ENDPOINT = 'https://your-server.com/api/rsvp'; // Replace with your server endpoint
        const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse'; // Replace with your Google Form URL

        // Google Forms field mapping - UPDATE THESE ENTRY IDs
        // To find these: open your Google Form, right-click on each field, "Inspect",
        // and look for name="entry.XXXXXXXX"
        const GOOGLE_FORM_FIELDS = {
            fullName: 'entry.123456789',      // Replace with actual entry ID
            email: 'entry.234567890',         // Replace with actual entry ID
            phone: 'entry.345678901',         // Replace with actual entry ID
            attending: 'entry.456789012',     // Replace with actual entry ID
            afterparty: 'entry.567890123',    // Replace with actual entry ID
            dietary: 'entry.678901234'        // Replace with actual entry ID
        };

        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Collect form data
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                attending: document.getElementById('attending').value,
                afterparty: document.getElementById('afterparty').value,
                dietary: document.getElementById('dietary').value,
                timestamp: new Date().toISOString()
            };

            let serverSuccess = false;
            let googleSuccess = false;

            // Send to your server
            try {
                const serverResponse = await fetch(SERVER_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (serverResponse.ok) {
                    serverSuccess = true;
                    console.log('Successfully sent to server');
                } else {
                    console.error('Server submission failed:', serverResponse.status);
                }
            } catch (error) {
                console.error('Error sending to server:', error);
            }

            // Send to Google Forms
            try {
                const googleFormData = new URLSearchParams();
                googleFormData.append(GOOGLE_FORM_FIELDS.fullName, formData.fullName);
                googleFormData.append(GOOGLE_FORM_FIELDS.email, formData.email);
                googleFormData.append(GOOGLE_FORM_FIELDS.phone, formData.phone);
                googleFormData.append(GOOGLE_FORM_FIELDS.attending, formData.attending);
                googleFormData.append(GOOGLE_FORM_FIELDS.afterparty, formData.afterparty);
                googleFormData.append(GOOGLE_FORM_FIELDS.dietary, formData.dietary);

                // Google Forms doesn't allow direct CORS, so we use no-cors mode
                // This means we won't get a response, but the form will be submitted
                await fetch(GOOGLE_FORM_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: googleFormData.toString()
                });

                googleSuccess = true;
                console.log('Successfully sent to Google Forms');
            } catch (error) {
                console.error('Error sending to Google Forms:', error);
            }

            // Show success message if at least one submission succeeded
            if (serverSuccess || googleSuccess) {
                document.getElementById('rsvpForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('There was an error submitting your RSVP. Please try again or contact us directly.');
            }
        });
    </script>
</body>
</html>
